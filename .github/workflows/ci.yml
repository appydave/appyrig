name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build shared
        run: npm run build --workspace=shared

      - name: Format
        run: npm run format:check

      - name: Architecture boundaries and banned strings
        run: npm run arch:check

      - name: Tests you can trust (no skips, sleeps, CI branches or snapshot switches)
        run: npm run test:trust

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Coverage thresholds (server, client)
        run: npm run test:coverage

  e2e:
    name: Browser tests (v2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # A throwaway token for the hub the tests start on this runner; ports are the defaults.
      HUB_TOKEN: ci-e2e-token-0123456789abcdef

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Playwright, v2 specs
        run: npm run test:e2e:v2

      - name: Keep the failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore

  provenance:
    name: OpenRig provenance
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Read the OpenRig pin
        id: pin
        run: |
          echo "commit=$(node -p "require('./shared/src/openrig/PROVENANCE.json').openrig.commit")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./shared/src/openrig/PROVENANCE.json').openrig.version")" >> "$GITHUB_OUTPUT"

      - name: Check out OpenRig at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: mvschwarz/openrig
          ref: ${{ steps.pin.outputs.commit }}
          path: openrig-src

      - name: Install the pinned OpenRig CLI
        run: npm install --prefix openrig-cli @openrig/cli@${{ steps.pin.outputs.version }}

      - name: Provenance
        env:
          OPENRIG_SRC: ${{ github.workspace }}/openrig-src
          OPENRIG_CLI: ${{ github.workspace }}/openrig-cli/node_modules/@openrig/cli
        run: npm run provenance
