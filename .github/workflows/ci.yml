name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install pnpm (the anti-slop plugin builds itself with it on install)
        run: npm install -g pnpm

      - name: Install dependencies
        run: npm install

      - name: Build shared
        run: npm run build --workspace=shared

      - name: Format
        run: npm run format:check

      - name: Architecture boundaries and banned strings
        run: npm run arch:check

      - name: Folder cycles (baselined)
        run: npm run arch:folders

      - name: Cycle baselines can only shrink
        run: npm run arch:ratchet

      - name: Dead code (Knip, normal and --production; baselined)
        run: npm run knip

      - name: Tests you can trust (no skips, sleeps, CI branches or snapshot switches)
        run: npm run test:trust

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: No type lies (Oxlint + anti-slop, baselined)
        run: npm run oxlint

      - name: Folder size (10 files, 10 subfolders; baselined)
        run: npm run folders

      - name: Palette only in CSS (Stylelint, baseline is a ratchet)
        run: npm run stylelint:ratchet

      - name: Test
        run: npm test

      - name: Coverage thresholds (server, client)
        run: npm run test:coverage

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # A throwaway token for the hub the tests start on this runner; ports are the defaults.
      HUB_TOKEN: ci-e2e-token-0123456789abcdef

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install pnpm (the anti-slop plugin builds itself with it on install)
        run: npm install -g pnpm

      - name: Install dependencies
        run: npm install

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npm run test:e2e

      - name: Keep the failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore

  duplicates:
    name: Duplicate detection
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install pnpm (the anti-slop plugin builds itself with it on install)
        run: npm install -g pnpm

      - name: Install dependencies
        run: npm install

      - name: No new clones (exact, renamed, near-miss; baselined)
        run: npm run lint:duplicates:fast

      - name: Keep the clone reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duplicate-reports
          path: .quality-results/jscpd/*.json
          if-no-files-found: error
          retention-days: 7

  provenance:
    name: OpenRig provenance
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install pnpm (the anti-slop plugin builds itself with it on install)
        run: npm install -g pnpm

      - name: Install dependencies
        run: npm install

      - name: Read the OpenRig pin
        id: pin
        run: |
          echo "commit=$(node -p "require('./shared/src/openrig/PROVENANCE.json').openrig.commit")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./shared/src/openrig/PROVENANCE.json').openrig.version")" >> "$GITHUB_OUTPUT"

      - name: Check out OpenRig at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: mvschwarz/openrig
          ref: ${{ steps.pin.outputs.commit }}
          path: openrig-src

      - name: Install the pinned OpenRig CLI
        run: npm install --prefix openrig-cli @openrig/cli@${{ steps.pin.outputs.version }}

      - name: Provenance
        env:
          OPENRIG_SRC: ${{ github.workspace }}/openrig-src
          OPENRIG_CLI: ${{ github.workspace }}/openrig-cli/node_modules/@openrig/cli
        run: npm run provenance
